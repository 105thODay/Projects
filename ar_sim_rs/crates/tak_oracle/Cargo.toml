[package]
name = "tak_oracle"
description = "Test-only: protobuf types generated by prost from the TAK Protocol v1 .proto files, as an oracle for cot_codec's hand-written TAK writer and reader (ruling R2)"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
prost = "0.14"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
cot_codec = { path = "../cot_codec" }
serde_json = "1"
